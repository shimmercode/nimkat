services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      NIMKAT_DATA_DIR: /data
      NIMKAT_SECRET: ${NIMKAT_SECRET:?Set NIMKAT_SECRET (min 32 chars)}
      NIMKAT_SETTINGS_KEY: ${NIMKAT_SETTINGS_KEY:?Set NIMKAT_SETTINGS_KEY (64 hex chars)}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://nimkat.ir}
      SITE_URL: ${SITE_URL:-https://nimkat.ir}
      APP_ORIGINS: ${APP_ORIGINS:-https://nimkat.ir}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      TRUST_PROXY: "1"
    volumes:
      - nimkat_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5173"
      API_INTERNAL_URL: http://backend:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://nimkat.ir}
      SITE_URL: ${SITE_URL:-https://nimkat.ir}
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${NIMKAT_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  nimkat_data:
